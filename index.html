<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>沙巴光伏自备电厂导航</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =====================================
         左侧导航
    ====================================== -->

    <aside class="sidebar">


        <!-- 公司名称 -->

        <div class="brand">

            <div class="brand-logo">
                光
            </div>


            <div class="brand-text">

                <h2>
                    沙巴光伏自备电厂
                </h2>

                <p>
                    系统导航
                </p>

            </div>

        </div>



        <!-- 导航菜单 -->

        <nav class="menu">


            <!-- 目前只有会议 -->

            <button
                class="menu-item active"
                data-category="会议"
            >

                <span>
                    会议
                </span>

            </button>


            <!--
            以后可以继续增加：

            <button
                class="menu-item"
                data-category="行政"
            >
                <span>
                    行政
                </span>
            </button>


            <button
                class="menu-item"
                data-category="采购"
            >
                <span>
                    采购
                </span>
            </button>

            -->


        </nav>



        <!-- 左侧底部 -->

        <div class="sidebar-footer">

            内部业务导航

        </div>


    </aside>



    <!-- =====================================
         主内容
    ====================================== -->

    <main class="main">


        <!-- 顶部 -->

        <header class="topbar">


            <div class="page-title">

                <h1>
                    沙巴光伏自备电厂导航
                </h1>

                <p>
                    常用业务系统快捷入口
                </p>

            </div>



            <!-- 搜索框 -->

            <div class="search-box">

                <span class="search-symbol">
                    搜索
                </span>

                <input
                    type="text"
                    id="search"
                    placeholder="搜索功能..."
                >

            </div>


        </header>



        <!-- =====================================
             内容
        ====================================== -->

        <section class="content">


            <!-- 模块标题 -->

            <div class="section-heading">

                <h2>
                    会议
                </h2>

                <p>
                    会议相关业务快捷入口
                </p>

            </div>



            <!-- =====================================
                 会议链接
            ====================================== -->

            <div
                id="meeting-links"
                class="link-grid"
            >


                <!-- ===============================
                     月计划
                ================================ -->

                <a
                    href="https://www.larksuite.com/"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="link-card"
                >

                    <div class="card-content">

                        <h3>
                            月计划
                        </h3>

                        <p>
                            月计划和周计划
                        </p>

                    </div>


                    <div class="card-arrow">
                        →
                    </div>

                </a>



                <!-- ===============================
                     消缺单
                ================================ -->

                <a
                    href="https://www.larksuite.com/"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="link-card"
                >

                    <div class="card-content">

                        <h3>
                            消缺单
                        </h3>

                        <p>
                            消缺单
                        </p>

                    </div>


                    <div class="card-arrow">
                        →
                    </div>

                </a>



                <!-- ===============================
                     会议纪要
                ================================ -->

                <a
                    href="https://www.larksuite.com/"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="link-card"
                >

                    <div class="card-content">

                        <h3>
                            会议纪要
                        </h3>

                        <p>
                            查看及编辑会议纪要
                        </p>

                    </div>


                    <div class="card-arrow">
                        →
                    </div>

                </a>



                <!-- ===============================
                     会议室
                ================================ -->

                <a
                    href="https://www.larksuite.com/"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="link-card"
                >

                    <div class="card-content">

                        <h3>
                            会议室预订
                        </h3>

                        <p>
                            查看会议室并进行预订
                        </p>

                    </div>


                    <div class="card-arrow">
                        →
                    </div>

                </a>


            </div>


        </section>



        <!-- =====================================
             页脚
        ====================================== -->

        <footer>

            © 2026 沙巴光伏自备电厂

        </footer>


    </main>



    <script src="script.js"></script>


</body>

</html>
