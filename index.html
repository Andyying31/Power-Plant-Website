<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>沙巴光伏自备电厂导航</title>

    <!--
        ?v=4 是为了避免浏览器继续读取旧版 CSS
    -->
    <link
        rel="stylesheet"
        href="style.css?v=4"
    >

</head>


<body>


    <!-- =========================================
         左侧导航
    ========================================== -->

    <aside class="sidebar">


        <!-- 公司名称 -->

        <div class="brand">

            <div class="brand-logo">
                光
            </div>


            <div class="brand-text">

                <h2>
                    沙巴光伏自备电厂
                </h2>

                <p>
                    系统导航
                </p>

            </div>

        </div>



        <!-- =========================================
             左侧菜单
        ========================================== -->

        <nav class="menu">


            <!-- 主页 -->

            <button
                type="button"
                class="menu-item active"
                data-page="home"
            >
                主页
            </button>



            <!-- 会议 -->

            <button
                type="button"
                class="menu-item"
                data-page="meeting"
            >
                会议
            </button>



            <!-- 日报 -->

            <button
                type="button"
                class="menu-item"
                data-page="daily"
            >
                日报
            </button>



            <!-- 花名册 -->

            <button
                type="button"
                class="menu-item"
                data-page="roster"
            >
                花名册
            </button>


        </nav>



        <!-- 左侧底部 -->

        <div class="sidebar-footer">

            内部业务导航

        </div>


    </aside>



    <!-- =========================================
         右边主内容
    ========================================== -->

    <main class="main">


        <!-- =========================================
             顶部
        ========================================== -->

        <header class="topbar">


            <!-- 标题 -->

            <div class="page-title">

                <h1 id="page-title">
                    沙巴光伏自备电厂导航
                </h1>


                <p id="page-subtitle">
                    部门常用业务统一入口
                </p>

            </div>



            <!-- 搜索 -->

            <div class="search-box">

                <span class="search-symbol">
                    搜索
                </span>


                <input
                    type="text"
                    id="search"
                    placeholder="搜索功能..."
                >

            </div>


        </header>



        <!-- =========================================
             主页

             默认显示
        ========================================== -->

        <section
            id="home-page"
            class="page-section active-page"
        >


            <div class="welcome-panel">


                <div class="welcome-small">

                    POWER PLANT PORTAL

                </div>



                <h2>

                    欢迎使用沙巴光伏自备电厂导航

                </h2>



                <p>

                    请从左侧导航栏选择需要进入的业务模块

                </p>


                <div class="welcome-line"></div>


                <div class="welcome-info">

                    <div>

                        <span>
                            系统
                        </span>

                        <strong>
                            内部业务导航
                        </strong>

                    </div>


                    <div>

                        <span>
                            部门
                        </span>

                        <strong>
                            沙巴光伏自备电厂
                        </strong>

                    </div>


                </div>


            </div>


        </section>



        <!-- =========================================
             会议
        ========================================== -->

        <section
            id="meeting-page"
            class="page-section"
        >


            <div class="section-heading">

                <h2>
                    会议
                </h2>


                <p>
                    会议相关业务快捷入口
                </p>

            </div>



            <div
                id="meeting-links"
                class="link-grid"
            >


                <!-- =================================
                     月计划
                ================================== -->

                <a
                    href="https://rjpl4x6x1094.jp.larksuite.com/sheets/Nj8msYUuWhUPQwt4bBWjKUkJpRd"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="link-card searchable"
                >


                    <div class="card-content">

                        <h3>
                            月计划
                        </h3>


                        <p>
                            月计划和周计划
                        </p>

                    </div>


                    <div class="card-arrow">
                        →
                    </div>


                </a>



                <!-- =================================
                     消缺单
                ================================== -->

                <a
                    href="https://www.larksuite.com/"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="link-card searchable"
                >


                    <div class="card-content">

                        <h3>
                            消缺单
                        </h3>


                        <p>
                            消缺单
                        </p>

                    </div>


                    <div class="card-arrow">
                        →
                    </div>


                </a>



                <!-- =================================
                     会议纪要
                ================================== -->

                <a
                    href="https://www.larksuite.com/"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="link-card searchable"
                >


                    <div class="card-content">

                        <h3>
                            会议纪要
                        </h3>


                        <p>
                            查看及编辑会议纪要
                        </p>

                    </div>


                    <div class="card-arrow">
                        →
                    </div>


                </a>



                <!-- =================================
                     会议室预订
                ================================== -->

                <a
                    href="https://www.larksuite.com/"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="link-card searchable"
                >


                    <div class="card-content">

                        <h3>
                            会议室预订
                        </h3>


                        <p>
                            查看会议室并进行预订
                        </p>

                    </div>


                    <div class="card-arrow">
                        →
                    </div>


                </a>


            </div>


        </section>



        <!-- =========================================
             日报
        ========================================== -->

        <section
            id="daily-page"
            class="page-section"
        >


            <div class="section-heading">

                <h2>
                    日报
                </h2>


                <p>
                    日报相关业务入口
                </p>

            </div>



            <div class="empty-panel">


                <div class="empty-title">
                    日报
                </div>


                <p>
                    日报内容暂未添加。
                </p>


            </div>


        </section>



        <!-- =========================================
             花名册
        ========================================== -->

        <section
            id="roster-page"
            class="page-section"
        >


            <div class="section-heading">

                <h2>
                    花名册
                </h2>


                <p>
                    部门人员及岗位信息
                </p>

            </div>



            <div class="empty-panel">


                <div class="empty-title">
                    花名册
                </div>


                <p>
                    花名册内容暂未添加。
                </p>


            </div>


        </section>



        <!-- =========================================
             页脚
        ========================================== -->

        <footer>

            © 2026 沙巴光伏自备电厂

        </footer>


    </main>



    <!--
        ?v=4 是为了避免浏览器继续读取旧版 JS
    -->

    <script src="script.js?v=4"></script>


</body>

</html>
